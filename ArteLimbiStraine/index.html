La aceste ateliere, limba străină nu este învățată izolat, ci devine limba în care copilul descoperă, creează și comunică.<br>

Fiecare atelier este construit în jurul unei teme – o poveste, un artist, o operă de artă, o călătorie, un oraș, o perioadă istorică,

Partea artistică poate include desen, pictură, modelaj, ceramică, colaj, origami și tehnici mixte, iar activitatea practică devine

vocabularul și capacitatea de comunicare, creativitatea, imaginația și simțul estetic.<br>

Atelierele au continuitate și sunt structurate ca un curs, fiecare întâlnire construindu-se pe ceea ce a fost explorat anterior.
